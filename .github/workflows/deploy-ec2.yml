
name: React EC2 Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build Test and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build React Application
        run: npm run build

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Configure SSH Host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package React Build
        run: tar -czf build.tar.gz -C build .

      - name: Copy Build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp build.tar.gz "$EC2_USER@$EC2_HOST:/home/$EC2_USER/react-build.tar.gz"

      - name: Deploy React Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" '
            mkdir -p /home/ubuntu/react-deploy &&
            rm -rf /home/ubuntu/react-deploy/* &&
            tar -xzf /home/ubuntu/react-build.tar.gz -C /home/ubuntu/react-deploy &&
            sudo find /var/www/html -mindepth 1 -maxdepth 1 -exec rm -rf {} + &&
            sudo cp -a /home/ubuntu/react-deploy/. /var/www/html/ &&
            sudo chown -R www-data:www-data /var/www/html &&
            sudo nginx -t &&
            sudo systemctl reload nginx
          '
